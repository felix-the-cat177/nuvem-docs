<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuvem - Documentos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a1a1a;
            color: #f0f0f0;
        }
        #ds-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #ds-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div id="ds-container">
        <div id="ds-frame">Carregando painel de documentos...</div>
    </div>

    <!-- Script oficial do OnlyOffice SDK -->
    <script src="https://docspace-mome08.onlyoffice.com/static/scripts/sdk/2.2.0/api.js?src=https%3A%2F%2Fdocspace-mome08.onlyoffice.com&mode=manager&width=100%25&height=100%25&frameId=ds-frame&showHeader=true&showTitle=true&showMenu=true&showFilter=true&disableActionButton=false&infoPanelVisible=true&init=true&filter%5Bcount%5D=100&filter%5Bpage%5D=1&filter%5Bsortorder%5D=descending&filter%5Bsortby%5D=DateAndTime&filter%5Bsearch%5D="></script>

</body>
</html>
