<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuvem - Painel Personalizado</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #18181b;
            color: #f4f4f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Barra de Ferramentas Customizada (Fora do Iframe) */
        .custom-toolbar {
            height: 56px;
            background-color: #27272a;
            border-bottom: 1px solid #3f3f46;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }

        .brand-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        /* Botões Estilizados */
        .btn {
            background-color: #3f3f46;
            color: #ffffff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            background-color: #52525b;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background-color: #2563eb;
        }

        .btn-primary:hover {
            background-color: #1d4ed8;
        }

        /* Container do DocSpace */
        #ds-container {
            flex: 1;
            width: 100%;
            height: calc(100vh - 56px);
        }

        #ds-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- 1. Barra de Controles Própria -->
    <header class="custom-toolbar">
        <div class="brand-title">
            <span>📁</span> Meus Documentos
        </div>

        <div class="action-buttons">
            <button class="btn btn-primary" onclick="recarregarPainel()">
                🔄 Atualizar
            </button>
            <button class="btn" onclick="abrirNovoGuia()">
                🔗 Abrir no Portal
            </button>
        </div>
    </header>

    <!-- 2. Área onde o DocSpace é Renderizado -->
    <main id="ds-container">
        <div id="ds-frame">Carregando gerenciador de arquivos...</div>
    </main>

    <!-- 3. Script com Parâmetros para Ocultar Elementos Nativos -->
    <script>
        // Parâmetros customizados do SDK:
        // showHeader=false -> Oculta o cabeçalho original
        // disableActionButton=true -> Oculta o botão nativo "+" de criar/subir
        // showMenu=true -> Mantém o menu lateral acessível
        const sdkUrl = "https://docspace-mome08.onlyoffice.com/static/scripts/sdk/2.2.0/api.js?" + new URLSearchParams({
            src: "https://docspace-mome08.onlyoffice.com",
            mode: "manager",
            width: "100%",
            height: "100%",
            frameId: "ds-frame",
            showHeader: "false",          // Esconde o cabeçalho nativo
            showTitle: "true",            // Mantém o nome da pasta atual
            showMenu: "true",             // Exibe a navegação lateral
            showFilter: "true",           // Exibe a busca
            disableActionButton: "true",  // Esconde o botão "+" nativo
            infoPanelVisible: "false",    // Esconde o painel lateral de detalhes
            init: "true"
        }).toString();

        // Injeta o script dinamicamente na página
        const script = document.createElement("script");
        script.src = sdkUrl;
        document.body.appendChild(script);

        // Funções acionadas pelos botões customizados
        function recarregarPainel() {
            const frame = document.querySelector("#ds-frame iframe");
            if (frame) {
                frame.src = frame.src; // Força o iframe a recarregar
            }
        }

        function abrirNovoGuia() {
            window.open("https://docspace-mome08.onlyoffice.com", "_blank");
        }
    </script>
</body>
</html>
