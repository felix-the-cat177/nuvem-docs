<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servidor - Aulas CMSP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #18181b;
            color: #f4f4f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Barra de topo customizada */
        .custom-toolbar {
            height: 52px;
            background-color: #27272a;
            border-bottom: 1px solid #3f3f46;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }

        /* Título no formato de diretório do Linux */
        .brand-title {
            font-size: 0.9rem;
            font-weight: 600;
            font-family: monospace, 'Courier New', Courier;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
            background: #18181b;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #3f3f46;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            background-color: #3f3f46;
            color: #ffffff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            background-color: #52525b;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background-color: #2563eb;
        }

        .btn-primary:hover {
            background-color: #1d4ed8;
        }

        #ds-container {
            flex: 1;
            width: 100%;
            height: calc(100vh - 52px);
        }

        #ds-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Topo Personalizado com o Diretório do Servidor -->
    <header class="custom-toolbar">
        <div class="brand-title">
            💻 <span>/home/pop-os_24.04_LTS_servidor/</span>
        </div>

        <div class="action-buttons">
            <button class="btn btn-primary" onclick="recarregarPainel()">
                🔄 Atualizar
            </button>
            <button class="btn" onclick="abrirNovoGuia()">
                🔗 Abrir no Portal
            </button>
        </div>
    </header>

    <!-- Área de Exibição da Sala Pública -->
    <main id="ds-container">
        <div id="ds-frame">Carregando repositório de aulas...</div>
    </main>

    <!-- Script Oficial da Sala Pública (com showHeader=false para não duplicar o topo) -->
    <script src="https://docspace-mome08.onlyoffice.com/static/scripts/sdk/2.2.0/api.js?src=https%3A%2F%2Fdocspace-mome08.onlyoffice.com&mode=public-room&width=100%25&height=100%25&frameId=ds-frame&showHeader=false&showTitle=true&showMenu=false&showFilter=true&disableActionButton=false&infoPanelVisible=false&init=true&filter%5Bcount%5D=100&filter%5Bpage%5D=1&filter%5Bsortorder%5D=descending&filter%5Bsortby%5D=DateAndTime&filter%5Bsearch%5D=&filter%5BwithSubfolders%5D=false&id=4501771&requestToken=NC81NVdYdi9vY2ZBMno1aDR6ZWx4NnIxQXRSTmI4ZEVuQzJINll1ZmNHND0_ImRlYzVjNTcwLWUzOTMtNGU1ZS1iMmVhLTdlOGNjYzk1ZTc5ZCI&rootPath=%2Frooms%2Fshare"></script>

    <script>
        function recarregarPainel() {
            const frame = document.querySelector("#ds-frame iframe");
            if (frame) {
                frame.src = frame.src;
            }
        }

        function abrirNovoGuia() {
            window.open("https://docspace-mome08.onlyoffice.com", "_blank");
        }
    </script>
</body>
</html>
